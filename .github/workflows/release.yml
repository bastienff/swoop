name: Release

# When a GitHub Release is published (tag vX.Y.Z):
#   1. build  — tests, Apple-silicon Release build; Swoop.dmg (drag-to-Applications installer) and
#               Swoop.zip (used by the Homebrew cask) + .sha256 files attached to the release
#   2. homebrew — updates Casks/swoop.rb in bastienff/homebrew-tap (skipped for pre-releases)
#   3. notes    — writes release notes from Conventional Commits since the previous tag
#                 (scripts/release_notes.sh) below anything typed in the release description
# Run it by hand (Actions → Release → Run workflow) for a test build as a workflow artifact; nothing is published.
#
# One-time setup for the Homebrew step:
#   - create the public repo bastienff/homebrew-tap
#   - add a fine-grained token with "Contents: read and write" on that repo as the secret HOMEBREW_TAP_TOKEN
#
# Developer ID signing + notarization (docs/RELEASING.md), from six secrets:
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD, APPLE_TEAM_ID,
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID
# Without them the build falls back to ad-hoc signing (users then need "Open Anyway") and says so in a warning.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # upload the dmg and zip to the release

jobs:
  build:
    name: Test, build & attach
    runs-on: macos-latest
    timeout-minutes: 60 # notarization usually takes minutes, rarely much longer
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes with git

      # The project needs Xcode 16+ (folder-synchronized groups, Swift 6, Swift Testing).
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            # Tags must be vX.Y.Z: the cask's download URL is built from it.
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
              echo "::error::Release tag must look like v1.2.0 (got '$GITHUB_REF_NAME')"; exit 1
            fi
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Core tests (SwoopCore)
        run: swift test --package-path Packages/SwoopCore

      # Imports the Developer ID certificate into a throwaway keychain and writes the notarization key.
      - name: Signing setup
        id: signing
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$TEAM_ID" ] || \
             [ -z "$NOTARY_KEY_P8_BASE64" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ]; then
            echo "::warning::Developer ID secrets are not all set; building ad-hoc signed and not notarized."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -t cert -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: .*"' | head -1 | tr -d '"')"
          [ -n "$IDENTITY" ] || { echo "::error::No Developer ID Application identity in the .p12"; exit 1; }
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "signed=true"
            echo "keychain=$KEYCHAIN"
            echo "identity=$IDENTITY"
            echo "team=$TEAM_ID"
          } >> "$GITHUB_OUTPUT"

      # Apple silicon only. Developer ID + hardened runtime + secure timestamp when the secrets are set
      # (needed for notarization); otherwise ad-hoc (an unsigned arm64 app won't launch).
      # CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO keeps Xcode from adding get-task-allow, which notarization rejects.
      - name: Build Swoop.app (Release, arm64)
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          TEAM_ID: ${{ steps.signing.outputs.team }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            SIGN_ARGS=(CODE_SIGN_IDENTITY="$IDENTITY" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID"
                       ENABLE_HARDENED_RUNTIME=YES CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
                       OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN")
          else
            SIGN_ARGS=(CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=)
          fi
          xcodebuild -project Swoop.xcodeproj -scheme Swoop -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${SIGN_ARGS[@]}" \
            build -quiet

      # Signed builds: notarize + staple the app before zipping it, then sign, notarize + staple the dmg.
      - name: Package
        id: package
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY: ${{ runner.temp }}/notary-key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          APP=build/DerivedData/Build/Products/Release/Swoop.app
          codesign --verify --deep --strict "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/Swoop")" = "arm64"
          if [ "$SIGNED" = "true" ]; then
            codesign -dvv "$APP" 2>&1 | grep -q "^Authority=Developer ID Application" \
              || { echo "::error::Swoop.app is not signed with Developer ID"; exit 1; }
            scripts/notarize.sh "$APP"
            spctl --assess --type execute --verbose "$APP"
          fi
          ditto -c -k --keepParent "$APP" Swoop.zip
          shasum -a 256 Swoop.zip | tee Swoop.zip.sha256
          scripts/make_dmg.sh "$APP" Swoop.dmg
          if [ "$SIGNED" = "true" ]; then
            codesign --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp Swoop.dmg
            scripts/notarize.sh Swoop.dmg
            spctl --assess --type open --context context:primary-signature --verbose Swoop.dmg
          fi
          shasum -a 256 Swoop.dmg | tee Swoop.dmg.sha256
          echo "sha256=$(cut -d' ' -f1 Swoop.zip.sha256)" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Swoop.dmg Swoop.dmg.sha256 Swoop.zip Swoop.zip.sha256 --clobber

      - name: Keep as artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Swoop-${{ steps.version.outputs.version }}-build${{ github.run_number }}
          path: |
            Swoop.dmg
            Swoop.dmg.sha256
            Swoop.zip
            Swoop.zip.sha256

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.signed == 'true'
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"

  notes:
    name: Release notes
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and tags, to find the previous release
          persist-credentials: false # notes are written with gh (GH_TOKEN), not git

      - name: Write notes into the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          scripts/release_notes.sh "$TAG" > generated.md
          # Keep what was typed in the release (e.g. a highlights paragraph). Drop a block generated by an
          # earlier run (re-runs replace it) and the "Full Changelog" line GitHub's "Generate release
          # notes" button adds — the generated notes end with their own compare link.
          gh release view "$TAG" --json body -q .body \
            | tr -d '\r' \
            | sed '/<!-- release-notes:start -->/,/<!-- release-notes:end -->/d' \
            | { grep -v '^\*\*Full Changelog\*\*: ' || true; } \
            | awk '{ line[NR] = $0 } NF { last = NR } END { for (i = 1; i <= last; i++) print line[i] }' > intro.md
          {
            if grep -q '[^[:space:]]' intro.md; then cat intro.md; echo; fi
            echo '<!-- release-notes:start -->'
            cat generated.md
            echo '<!-- release-notes:end -->'
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

  homebrew:
    name: Update Homebrew tap
    needs: build
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.ok == 'true'
        with:
          path: swoop
          persist-credentials: false # only the tap checkout below pushes

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.ok == 'true'
        with:
          repository: bastienff/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write Casks/swoop.rb and push
        if: steps.token.outputs.ok == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          mkdir -p tap/Casks
          swoop/scripts/make_cask.sh "$VERSION" "$SHA256" > tap/Casks/swoop.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/swoop.rb
          if git diff --cached --quiet; then echo "Cask already up to date"; exit 0; fi
          git commit -m "swoop $VERSION"
          git push
