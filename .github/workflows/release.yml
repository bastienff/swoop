name: Release

# When a GitHub Release is published (tag vX.Y.Z):
#   1. build  — tests, Apple-silicon Release build, Swoop.zip + .sha256 attached to the release
#   2. homebrew — updates Casks/swoop.rb in bastienff/homebrew-tap (skipped for pre-releases)
#   3. notes    — writes release notes from Conventional Commits since the previous tag
#                 (scripts/release_notes.sh) below anything typed in the release description
# Run it by hand (Actions → Release → Run workflow) for a test build as a workflow artifact; nothing is published.
#
# One-time setup for the Homebrew step:
#   - create the public repo bastienff/homebrew-tap
#   - add a fine-grained token with "Contents: read and write" on that repo as the secret HOMEBREW_TAP_TOKEN
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # upload the zip to the release

jobs:
  build:
    name: Test, build & attach
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      # The project needs Xcode 16+ (folder-synchronized groups, Swift 6, Swift Testing).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            # Tags must be vX.Y.Z: the cask's download URL is built from it.
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
              echo "::error::Release tag must look like v1.2.0 (got '$GITHUB_REF_NAME')"; exit 1
            fi
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Core tests (SwoopCore)
        run: swift test --package-path Packages/SwoopCore

      # Apple silicon only. Ad-hoc signed (an unsigned arm64 app won't launch); Developer ID signing +
      # notarization can replace this once certificates are stored as secrets.
      - name: Build Swoop.app (Release, arm64)
        run: |
          xcodebuild -project Swoop.xcodeproj -scheme Swoop -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build -quiet

      - name: Package
        id: package
        run: |
          APP=build/DerivedData/Build/Products/Release/Swoop.app
          codesign --verify --deep --strict "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/Swoop")" = "arm64"
          ditto -c -k --keepParent "$APP" Swoop.zip
          shasum -a 256 Swoop.zip | tee Swoop.zip.sha256
          echo "sha256=$(cut -d' ' -f1 Swoop.zip.sha256)" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Swoop.zip Swoop.zip.sha256 --clobber

      - name: Keep as artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: Swoop-${{ steps.version.outputs.version }}-build${{ github.run_number }}
          path: |
            Swoop.zip
            Swoop.zip.sha256

  notes:
    name: Release notes
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, to find the previous release

      - name: Write notes into the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          scripts/release_notes.sh "$TAG" > generated.md
          # Keep what was typed in the release (e.g. a highlights paragraph). Drop a block generated by an
          # earlier run (re-runs replace it) and the "Full Changelog" line GitHub's "Generate release
          # notes" button adds — the generated notes end with their own compare link.
          gh release view "$TAG" --json body -q .body \
            | tr -d '\r' \
            | sed '/<!-- release-notes:start -->/,/<!-- release-notes:end -->/d' \
            | { grep -v '^\*\*Full Changelog\*\*: ' || true; } \
            | awk '{ line[NR] = $0 } NF { last = NR } END { for (i = 1; i <= last; i++) print line[i] }' > intro.md
          {
            if grep -q '[^[:space:]]' intro.md; then cat intro.md; echo; fi
            echo '<!-- release-notes:start -->'
            cat generated.md
            echo '<!-- release-notes:end -->'
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

  homebrew:
    name: Update Homebrew tap
    needs: build
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.ok == 'true'
        with:
          path: swoop

      - uses: actions/checkout@v7
        if: steps.token.outputs.ok == 'true'
        with:
          repository: bastienff/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write Casks/swoop.rb and push
        if: steps.token.outputs.ok == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          mkdir -p tap/Casks
          swoop/scripts/make_cask.sh "$VERSION" "$SHA256" > tap/Casks/swoop.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/swoop.rb
          if git diff --cached --quiet; then echo "Cask already up to date"; exit 0; fi
          git commit -m "swoop $VERSION"
          git push
