name: Welcome

# A short thank-you on someone's first issue or pull request.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue! 🙌 It'll be looked at soon.
            If it's about a window Swoop couldn't reach, the app involved and how your desktops are set up
            (Spaces, full screen, native tabs) usually make it much faster to fix.
          pr-message: |
            Thanks for your first pull request! 🙌 Checks will run in a moment.
            Please make sure the checklist in the description is filled in; CONTRIBUTING.md has the details.
