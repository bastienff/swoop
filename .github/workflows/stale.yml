name: Stale

# Only closes issues/PRs that are waiting on the reporter (label "needs info") and went quiet.
on:
  schedule:
    - cron: "30 3 * * 1" # Mondays
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v9
        with:
          only-labels: "needs info"
          days-before-stale: 21
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue is waiting for more information and has been quiet for 3 weeks.
            It will close in 2 weeks unless there's an update. Any comment keeps it open.
          stale-pr-message: >
            This pull request is waiting for changes and has been quiet for 3 weeks.
            It will close in 2 weeks unless there's an update. Any comment keeps it open.
          close-issue-message: Closed for now because of no update. Comment anytime and it can be reopened.
          close-pr-message: Closed for now because of no update. Feel free to reopen when you're back to it.
